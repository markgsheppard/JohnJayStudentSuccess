<p style="margin: 0; font-size: 16px; color: #3D4752">A 36-credit graduate program in applied, pluralist economics. Students study political economy, the economics of gender, environmental sustainability, economic development, and global inequality of income and wealth, while building writing and data analysis skills.</p>
</div>

<div style="background: #F2F4F7; padding: 14px; text-align: center"><span style="display: block; font-family: 'Nunito Sans', 'Open Sans', Arial, sans-serif; font-size: 30px; font-weight: 700; color: #232C64">6</span><span style="font-size: 13px; font-weight: 700">core courses</span></div>
<div style="background: #F2F4F7; padding: 14px; text-align: center"><span style="display: block; font-family: 'Nunito Sans', 'Open Sans', Arial, sans-serif; font-size: 30px; font-weight: 700; color: #232C64">6</span><span style="font-size: 13px; font-weight: 700">electives</span></div>

<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px">
<li>A bachelor's degree; see John Jay graduate admissions for prerequisites, materials and deadlines</li>
<li>Talk with the graduate program director about your preparation in economics, math and statistics</li>
</ul>
<div style="border: 1px solid #DCE1E7; padding: 14px; font-size: 14px"><strong style="display: block; font-size: 15px">Already a John Jay economics major?</strong>The dual admission / accelerated BS/MA lets qualifying undergraduates earn both degrees with 134 total credits. Students must keep a 3.5 GPA each semester.</div>
</div>
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 12px">
<h4 style="margin: 0; font-size: 19px">Step 2 · Complete the core (18 credits)</h4>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F2F4F7"><strong style="flex: none; width: 82px; color: #232C64">ECO 713</strong>Political Economy</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F2F4F7"><strong style="flex: none; width: 82px; color: #232C64">ECO 720</strong>Macroeconomics</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F2F4F7"><strong style="flex: none; width: 82px; color: #232C64">ECO 725</strong>Microeconomics</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F2F4F7"><strong style="flex: none; width: 82px; color: #232C64">ECO 750</strong>Mathematics for Economists</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F2F4F7"><strong style="flex: none; width: 82px; color: #232C64">ECO 751</strong>Research Methods I: Quantitative Analysis</li>
<li style="display: flex; gap: 12px; padding: 10px 12px; background: #F2F4F7"><strong style="flex: none; width: 82px; color: #232C64">ECO 799</strong>Seminar in Economics</li>
</ol>

<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px">
<li style="padding: 6px 10px; border: 1px solid #CBD3DC">CRJ 741 Economic Analysis of Crime</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 711 Economic History</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 731 Economic Development</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 740 Community Economic Development</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 744 International Finance &amp; Trade</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 745 International Political Economy</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 746 Alternative Economic Systems</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 752 Research Methods II</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 760 Political Economy of the Environment</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 780 Selected Topics</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 794 Independent Study</li><li style="padding: 6px 10px; border: 1px solid #CBD3DC">ECO 798 Faculty-Mentored Research</li>
</ul>

<li style="background: #F2F4F7; padding: 18px; border-top: 4px solid #232C64; display: flex; flex-direction: column; gap: 6px"><strong style="font-size: 13px; letter-spacing: 1px; color: #232C64">LEVEL II · YEARS 2–3</strong><strong style="font-size: 17px">Fields &amp; Second Exam</strong><span style="font-size: 14px; color: #3D4752">Complete field courses, then pass the Second Examination (a field exam, usually in August) within 10 registered semesters.</span></li>
