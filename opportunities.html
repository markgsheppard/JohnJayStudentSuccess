<section style="max-width: 1240px; margin: 0 auto; padding: 28px 24px 24px">
<a href="index.html" style="display: inline-block; margin-bottom: 14px; font-size: 15px; font-weight: 700; text-decoration: none">← Back to Student Success &amp; Graduate Pathways</a>
<h1 style="margin: 0 0 12px; font-family: 'Nunito Sans', 'Open Sans', Arial, sans-serif; font-size: 48px; line-height: 1.1">Internships, Research Assistantships &amp; Programs</h1>
<p style="margin: 0 0 8px; font-size: 19px; color: #3D4752; max-width: 860px">Internships and first jobs for economics students: think tanks and policy research, Congress and government agencies, the Federal Reserve, university pre-doctoral research, banks and economic consulting, and AEA pipeline programs.</p>
<p style="margin: 0; font-size: 14px; color: #525D69">Last updated November 12, 2026 · Sources: employer career pages, the #econ_ra feed, congressional offices, the AEA, PREDOC.org and the Federal Reserve. Timing shown is the usual recruiting calendar; always confirm dates on the official posting.</p>
</section>

<div style="background: #F2F4F7; border-top: 1px solid #DCE1E7; border-bottom: 1px solid #DCE1E7">
<div style="max-width: 1240px; margin: 0 auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div role="group" aria-label="Filter by category" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
<sc-if value="{{ c.active }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ c.pick }}" aria-pressed="true" style="font: inherit; font-size: 15px; font-weight: 700; min-height: 44px; padding: 0 18px; background: #232C64; color: #FFFFFF; border: 1px solid #232C64; border-radius: 999px; cursor: pointer">{{ c.label }} ({{ c.count }})</button>
</sc-if>
<sc-if value="{{ c.inactive }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ c.pick }}" aria-pressed="false" style="font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 18px; background: #FFFFFF; color: #1D242C; border: 1px solid #9FAAB6; border-radius: 999px; cursor: pointer">{{ c.label }} ({{ c.count }})</button>
</sc-if>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end">
<label for="opp-search" style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700">Search
<input id="opp-search" type="search" value="{{ q }}" onChange="{{ onSearch }}" placeholder="Organization, field, city…" style="font: inherit; font-weight: 400; min-height: 44px; padding: 8px 12px; border: 1px solid #9FAAB6; background: #FFFFFF"></label>
<label for="opp-level" style="flex: 0 1 240px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700">Who can apply
<select id="opp-level" value="{{ level }}" onChange="{{ onLevel }}" style="font: inherit; font-weight: 400; min-height: 44px; padding: 8px 12px; border: 1px solid #9FAAB6; background: #FFFFFF">
<option value="all">Everyone</option>
<option value="Undergraduate">Current undergraduates</option>
<option value="Recent graduate">Recent graduates</option>
<option value="Graduate">Graduate students</option>
</select></label>
<label for="opp-closed" style="display: flex; gap: 10px; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600">
<input id="opp-closed" type="checkbox" checked="{{ hideClosed }}" onChange="{{ onClosed }}" style="width: 20px; height: 20px">Hide closed postings</label>
</div>
</div>
</div>

<section style="max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px">
<p style="margin: 0 0 18px; font-size: 15px; font-weight: 700; color: #3D4752" aria-live="polite">{{ resultLabel }}</p>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px; background: #F2F4F7; text-align: center">
<p style="margin: 0 0 12px; font-size: 18px; font-weight: 700">No postings match those filters.</p>
<button type="button" onClick="{{ reset }}" style="font: inherit; font-weight: 700; min-height: 44px; padding: 0 20px; background: #232C64; color: #FFFFFF; border: 0; cursor: pointer">Clear filters</button>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
<article style="border: 1px solid #DCE1E7; border-top: 5px solid #232C64; padding: 22px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<sc-if value="{{ it.isOpen }}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; font-weight: 700; padding: 3px 10px; background: #E3F1E6; color: #1F5130">Open</span></sc-if>
<sc-if value="{{ it.isRolling }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 700; padding: 3px 10px; background: #E2ECF7; color: #1D4470">Rolling</span></sc-if>
<sc-if value="{{ it.isUpcoming }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 700; padding: 3px 10px; background: #D6F1FC; color: #10325A">Check dates</span></sc-if>
<sc-if value="{{ it.isClosed }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 700; padding: 3px 10px; background: #E8EBEF; color: #3D4752">Closed · next cycle</span></sc-if>
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.6px; color: #525D69; text-transform: uppercase">{{ it.cat }}</span>
</div>
<h2 style="margin: 0; font-size: 20px; line-height: 1.25">{{ it.title }}</h2>
<p style="margin: 0; font-size: 16px; font-weight: 600; color: #232C64">{{ it.org }}</p>
<dl style="margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 15px">
<dt style="font-weight: 700; color: #525D69">Deadline</dt><dd style="margin: 0">{{ it.deadline }}</dd>
<dt style="font-weight: 700; color: #525D69">Who</dt><dd style="margin: 0">{{ it.who }}</dd>
<dt style="font-weight: 700; color: #525D69">Where</dt><dd style="margin: 0">{{ it.where }}</dd>
<dt style="font-weight: 700; color: #525D69">Pay</dt><dd style="margin: 0">{{ it.pay }}</dd>
</dl>
<div style="margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<a href="{{ it.url }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; background: #232C64; color: #FFFFFF; font-weight: 700; text-decoration: none">View posting ↗</a>
<span style="font-size: 13px; color: #525D69">Found via {{ it.source }}</span>
</div>
</article>
</sc-for>
</div>

<div style="margin-top: 40px; padding: 24px; background: #F2F4F7; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<div style="flex: 1 1 520px">
<strong style="display: block; font-size: 18px">Know of an opportunity we're missing?</strong>
<span style="font-size: 15px; color: #3D4752">Faculty, alumni and employers can send postings to Rita Taveras, Academic Program Manager (646.557.4835).</span>
</div>

</div>
</section>

const CATS = ["All", "Think tanks & policy research", "Congress & Government", "Federal Reserve", "Predoc & RA", "Banks, consulting & industry", "AEA & Pipeline"];
const ORDER = {open:0, rolling:1, upcoming:2, closed:3};
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { cat: "All", level: "all", hideClosed: false, q: "" }; }
  renderVals() {
    const s = this.state;
    const q = (s.q || "").toLowerCase().trim();
    const base = OPPS.filter(o => (s.level === "all" || o.levels.indexOf(s.level) > -1) && (!s.hideClosed || o.status !== "closed") && (!q || (o.title + " " + o.org + " " + o.where + " " + o.who + " " + o.cat).toLowerCase().indexOf(q) > -1));
    const list = base.filter(o => s.cat === "All" || o.cat === s.cat).slice().sort((a,b) => ORDER[a.status] - ORDER[b.status]);
    const items = list.map(o => Object.assign({}, o, { isOpen: o.status === "open", isRolling: o.status === "rolling", isUpcoming: o.status === "upcoming", isClosed: o.status === "closed" }));
    const cats = CATS.map(c => ({ label: c, count: c === "All" ? base.length : base.filter(o => o.cat === c).length, active: s.cat === c, inactive: s.cat !== c, pick: () => this.setState({ cat: c }) }));
    const n = items.length;
    return {
      items, cats, q: s.q, level: s.level, hideClosed: s.hideClosed,
      empty: n === 0,
      resultLabel: "Showing " + n + " of " + OPPS.length + " opportunities",
      onSearch: (e) => this.setState({ q: e.target.value }),
      onLevel: (e) => this.setState({ level: e.target.value }),
      onClosed: (e) => this.setState({ hideClosed: e.target.checked }),
      reset: () => this.setState({ cat: "All", level: "all", hideClosed: false, q: "" })
    };
  }
}
DCLite.mount(Component);
